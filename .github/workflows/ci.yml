name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triplet: x64-osx
          - os: windows-latest
            triplet: x64-windows
          - os: ubuntu-latest
            triplet: x64-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev

      # jurplel/install-qt-action wraps aqtinstall and resolves the
      # per-OS/per-arch Qt install directory for us, exporting it as the
      # Qt6_DIR environment variable (see https://github.com/jurplel/install-qt-action).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          cache: true

      - name: Configure (CMake + vcpkg manifest)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DQt6_DIR="$Qt6_DIR" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMULTICUE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Debug -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Debug

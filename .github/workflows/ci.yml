name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Pinned ourselves rather than trusting the runner image's preinstalled
  # vcpkg: that one's shallow-clone depth and baked-in commit vary by image
  # and repeatedly broke builtin-baseline resolution (git-show on a commit
  # outside the shallow horizon, then a version-database gap once
  # unshallowed). This SHA must stay >= vcpkg.json's builtin-baseline.
  VCPKG_REF: d186940b2f0c4e8e5b4ff804af57d2a26fbfa091

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triplet: arm64-osx
          - os: windows-latest
            triplet: x64-windows
          - os: ubuntu-latest
            triplet: x64-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev nasm autoconf automake autoconf-archive libtool

      # vcpkg's ffmpeg port only auto-downloads nasm on Windows; macOS and
      # Linux both need it preinstalled via their system package manager.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v4
        with:
          path: .vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ env.VCPKG_REF }}

      - name: Checkout vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: .vcpkg

      - name: Bootstrap vcpkg (Windows)
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: cmd
        run: .vcpkg\bootstrap-vcpkg.bat

      - name: Bootstrap vcpkg (Unix)
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: ./.vcpkg/bootstrap-vcpkg.sh

      # vcpkg's default binary-cache location per OS; ffmpeg alone takes
      # 20-40 min to build from source, so without this every run rebuilds
      # the whole manifest from scratch.
      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      # jurplel/install-qt-action wraps aqtinstall and resolves the
      # per-OS/per-arch Qt install directory for us, exporting it as the
      # Qt6_DIR environment variable (see https://github.com/jurplel/install-qt-action).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true
          extra: '--base https://ftp.jaist.ac.jp/pub/qtproject'

      - name: Configure (CMake + vcpkg manifest)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DQt6_DIR="$Qt6_DIR" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMULTICUE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Debug -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Debug

  sanitizers:
    # ASan/UBSan on the audio-thread-adjacent code (RingBuffer, Voice,
    # RealtimeAudioEngine, PieceMixer, MasterLimiter) is how
    # docs/ROADMAP.md's M1 real-time-safety claims get checked mechanically
    # rather than by inspection alone. Linux + macOS only for now: MSVC's
    # /fsanitize=address has different semantics and setup, deferred to a
    # later milestone rather than guessed at here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triplet: arm64-osx
          - os: ubuntu-latest
            triplet: x64-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev nasm autoconf automake autoconf-archive libtool

      # vcpkg's ffmpeg port only auto-downloads nasm on Windows; macOS and
      # Linux both need it preinstalled via their system package manager.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v4
        with:
          path: .vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ env.VCPKG_REF }}

      - name: Checkout vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: .vcpkg

      - name: Bootstrap vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        shell: bash
        run: ./.vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true
          extra: '--base https://ftp.jaist.ac.jp/pub/qtproject'

      - name: Configure (CMake + vcpkg manifest, sanitizers on)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DQt6_DIR="$Qt6_DIR" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMULTICUE_BUILD_TESTS=ON \
            -DMULTICUE_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build --config Debug -j

      - name: Test under ASan/UBSan
        working-directory: build
        run: ctest --output-on-failure --build-config Debug

  package:
    # Only on version tags -- a Debug matrix build already runs on every
    # push/PR above; this job produces the user-facing installer/AppImage
    # and attaches it to the GitHub Release for that tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows
          - os: ubuntu-latest
            triplet: x64-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system audio headers + AppImage runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libfuse2 nasm autoconf automake autoconf-archive libtool

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v4
        with:
          path: .vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ env.VCPKG_REF }}

      - name: Checkout vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: .vcpkg

      - name: Bootstrap vcpkg (Windows)
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: cmd
        run: .vcpkg\bootstrap-vcpkg.bat

      - name: Bootstrap vcpkg (Unix)
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: ./.vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true
          extra: '--base https://ftp.jaist.ac.jp/pub/qtproject'

      - name: Configure (CMake + vcpkg manifest, Release)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DQt6_DIR="$Qt6_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DMULTICUE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release -j

      # VCPKG_APPLOCAL_DEPS (on by default under the vcpkg toolchain) already
      # copied every vcpkg-built DLL next to multicue.exe post-build; the one
      # thing left is Qt's own DLLs + platform plugin, which windeployqt
      # knows how to find relative to its own install (not under vcpkg).
      - name: Package (Windows, windeployqt + zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          QT_BIN="$(dirname "$(dirname "$(dirname "$Qt6_DIR")")")/bin"
          "$QT_BIN/windeployqt.exe" --release build/apps/multicue/Release/multicue.exe
          mkdir -p dist
          cp -r build/apps/multicue/Release "dist/MultiCue"
          cd dist && 7z a -tzip "../MultiCue-windows-x64.zip" "MultiCue"

      # Static vcpkg linkage on Linux (x64-linux triplet) means ffmpeg/
      # rtaudio/sndfile/samplerate are already inside the binary -- only Qt
      # and its plugins need bundling, which linuxdeploy-plugin-qt handles.
      - name: Package (Linux, linuxdeploy AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -q -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp apps/multicue/resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/multicue.png
          cat > AppDir/usr/share/applications/multicue.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MultiCue
          Exec=multicue
          Icon=multicue
          Categories=AudioVideo;
          EOF

          QT_BIN="$(dirname "$(dirname "$(dirname "$Qt6_DIR")")")/bin"
          export QMAKE="$QT_BIN/qmake6"
          export PATH="$QT_BIN:$PATH"
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            -e build/apps/multicue/multicue \
            -d AppDir/usr/share/applications/multicue.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/multicue.png \
            --plugin qt \
            --output appimage
          mv MultiCue*.AppImage MultiCue-linux-x86_64.AppImage

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: MultiCue-*
